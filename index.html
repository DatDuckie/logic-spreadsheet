<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Spreadsheet Circuit PWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>
    <div class="top-bar">
      <h1>LogicSheet PWA</h1>
      <div class="actions">
        <button id="export-btn">Export CSV</button>
      </div>
    </div>
    <div class="menu-bar" id="menu-bar">
      <!-- Dynamically populated toolbar items -->
    </div>
  </header>

  <div class="status-bar">
    <span id="status-text">Cell: A1 | Mode: NAV</span>
  </div>

  <div class="grid-container" id="grid-container">
    <!-- Spreadsheet table rendered here -->
  </div>

  <div class="context-menu" id="context-menu">
    <div class="context-menu-item" id="ctx-delete">Delete Row/Col</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
