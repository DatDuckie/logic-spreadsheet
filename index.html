<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>LogicGrid</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>
    <div class="toolbar-row">
      <div class="menu-bar" id="menu-bar">
        <!-- Dynamically populated toolbar items -->
      </div>
      <button id="export-btn" class="export-btn">Export CSV</button>
    </div>
  </header>

  <div class="status-bar">
    <span id="status-text">Cell: A1 | Mode: NAV</span>
    <span id="zoom-text">Zoom: 100%</span>
  </div>

  <div class="grid-container" id="grid-container">
    <div class="grid-zoom-wrapper" id="grid-zoom-wrapper">
      <!-- Spreadsheet table rendered here -->
    </div>
  </div>

  <div class="context-menu" id="context-menu">
    <div class="context-menu-item" id="ctx-delete">Delete</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
